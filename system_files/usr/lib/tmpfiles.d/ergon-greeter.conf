# Noctalia greeter state (greeter.toml, synced wallpaper/colours). /var isn't updated
# from the image on rebases/upgrades, so create it at boot instead.
d /var/lib/noctalia-greeter 0750 greetd greetd -

# Fedora's greetd package masks xdg-desktop-portal for the greeter user by shipping this symlink
# in /var; recreate it so it also exists on systems that rebased onto ergon.
d /var/lib/greetd/.config 0755 greetd greetd -
d /var/lib/greetd/.config/systemd 0755 greetd greetd -
d /var/lib/greetd/.config/systemd/user 0755 greetd greetd -
L /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null
