# ergon: overrides /usr/share/xdg-desktop-portal/niri-portals.conf.
# GNOME portal for screencasting/screenshots (niri implements Mutter's interfaces),
# KDE portal for file dialogs so they're Qt, KWallet instead of gnome-keyring for secrets.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.FileChooser=kde;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=kwallet;
