---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

# Runs on Gateshare's self-hosted runners, which have Docker but not podman. The job runs inside
# the official podman image (privileged, so podman can build and rpm-ostree can rechunk), so
# nothing is installed on the host. Podman's storage is the named Docker volume
# "ergon-podman-storage": the base image stays cached between builds, and the last step deletes
# this build's own images. Host needs ~50 GB free for Docker.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: [self-hosted, linux, x64]
    container:
      image: quay.io/podman/stable:v5.8.9
      options: --privileged
      volumes:
        # Named, not the image's anonymous VOLUME: the runner never removes anonymous volumes.
        - ergon-podman-storage:/var/lib/containers
    defaults:
      run:
        shell: bash

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # Before checkout: a missing git makes checkout fall back to a tarball without .git.
      # The workspace is owned by the host's runner user but steps run as root here, so git
      # needs it marked safe (checkout only does that for its own step).
      # The podman image defaults to fuse-overlayfs, which needs /dev/fuse (absent on the runner
      # host). As privileged root on a real Docker volume, kernel overlay works and is faster.
      # Podman caches that choice in the storage (.has-mount-program), which lives on the
      # persistent volume, so drop the cache too. "fsync=0" is a fuse-overlayfs-only mount option
      # that kernel overlay rejects ("invalid argument").
      - name: Install build tools
        run: |
          dnf -y install --setopt=install_weak_deps=False git jq
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          sed -i \
            -e 's|^mount_program = "/usr/bin/fuse-overlayfs"|#&|' \
            -e 's|^mountopt = "nodev,fsync=0"|mountopt = "nodev"|' \
            /etc/containers/storage.conf
          rm -f /var/lib/containers/storage/overlay/.has-mount-program
          podman info --format 'storage: {{.Store.GraphDriverName}} {{json .Store.GraphStatus}}'

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      # podman login instead of docker/login-action: there's no docker CLI in the podman container.
      # --compat-auth-file also writes ~/.docker/config.json, which is where cosign looks.
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin \
            --compat-auth-file "${HOME}/.docker/config.json"

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      # The ergon-podman-storage volume outlives the job: drop this build's images (each ~8 GB,
      # plus the rechunked copy) and keep the cached base image. HOME is the runner's mounted
      # temp dir, so remove the registry login written there too.
      - name: Clean up local images and login
        if: always()
        run: |
          podman logout --all || true
          rm -f "${HOME}/.docker/config.json"
          [[ -n "${IMAGE_NAME:-}" ]] || exit 0  # failed before naming the image: nothing of ours to remove
          podman images --filter "reference=*/${IMAGE_NAME}" --filter "reference=${IMAGE_NAME}" --format '{{.ID}}' \
            | sort -u | xargs -r podman rmi -f || true
          podman image prune -f || true
